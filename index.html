<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Trader 30-Day Bootcamp Elite</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }

        .pulse-border { animation: pulseBorder 2s infinite; }
        @keyframes pulseBorder { 
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } 
        }

        .chart-bg {
            background-color: #0f172a;
            background-image: 
                linear-gradient(rgba(51, 65, 85, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 65, 85, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .sim-btn { transition: all 0.2s; }
        .sim-btn:active { transform: scale(0.95); }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }

        @keyframes candleFluctuate {
            0% { height: 40px; top: 40px; background-color: #22c55e;}
            25% { height: 60px; top: 20px; background-color: #22c55e;}
            50% { height: 20px; top: 60px; background-color: #ef4444;}
            75% { height: 70px; top: 10px; background-color: #22c55e;}
            100% { height: 40px; top: 40px; background-color: #22c55e;}
        }
        .live-candle-body { animation: candleFluctuate 3s infinite ease-in-out; position: absolute; width: 24px; left: 50%; transform: translateX(-50%); border-radius: 2px;}
        .live-candle-wick { position: absolute; width: 2px; height: 100px; top: 10px; background-color: #64748b; left: 50%; transform: translateX(-50%);}
    </style>
</head>

                <div class="fade-in pb-10">
                    <div class="bg-gradient-to-r from-slate-900 to-slate-800 rounded-2xl p-4 border border-slate-700 shadow-lg mb-6 flex justify-between items-center">
                        <div><p class="text-[11px] text-slate-400 mb-1 uppercase font-bold tracking-wide">Akurasi Win Rate</p><h3 class="text-3xl font-black ${winRate >= 50 ? 'text-green-400' : 'text-red-400'} drop-shadow-md">${winRate}%</h3></div>
                        <div class="text-right"><p class="text-[11px] text-slate-400 mb-1 uppercase font-bold tracking-wide">Total Trade</p><h3 class="text-2xl font-bold text-white drop-shadow-md">${journalData.length}</h3></div>
                    </div>

                    <div class="bg-slate-900 rounded-xl p-5 border border-slate-800 shadow-md mb-6 relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-1 bg-blue-500"></div>
                        <h3 class="font-bold text-white mb-4 text-[15px] flex items-center gap-2"><i class="fa-solid fa-pen-to-square text-blue-500"></i> Catat Eksekusi Lot 0.01</h3>
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div><label class="text-[10px] text-slate-400 uppercase font-bold tracking-wide">Instrumen</label><select id="j-pair" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm appearance-none mt-1"><option>XAUUSD (Gold)</option><option>EURUSD</option><option>GBPUSD</option><option>Lainnya</option></select></div>
                            <div><label class="text-[10px] text-slate-400 uppercase font-bold tracking-wide">Aksi</label><select id="j-action" class="w-full bg-slate-800 border border-slate-700 text-white rounded-lg p-2.5 text-sm appearance-none mt-1"><option value="BUY">🟢 BUY</option><option value="SELL">🔴 SELL</option></select></div>
                        </div>
                        <div class="mb-4">
                            <label class="text-[10px] text-slate-400 uppercase font-bold tracking-wide">Hasil</label>
                            <div class="flex gap-2 mt-1">
                                <button id="btn-win" onclick="selectResult('WIN')" class="flex-1 bg-slate-800 border border-slate-700 text-slate-300 py-2.5 rounded-lg text-sm font-bold shadow-sm">WIN</button>
                                <button id="btn-loss" onclick="selectResult('LOSS')" class="flex-1 bg-slate-800 border border-slate-700 text-slate-300 py-2.5 rounded-lg text-sm font-bold shadow-sm">LOSS</button>
                            </div><input type="hidden" id="j-result" value="">
                        </div>
                        <div class="mb-5">
                            <label class="text-[10px] text-slate-400 uppercase font-bold tracking-wide">Catatan Emosi & Alasan</label>
                            <textarea id="j-notes" rows="2" placeholder="Cth: Sesuai plan." class="w-full bg-slate-800 border border-slate-700 text-slate-200 rounded-lg p-3 text-xs mt-1 resize-none placeholder-slate-500"></textarea>
                        </div>
                        <button onclick="saveJournal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl text-sm transform transition hover:-translate-y-0.5 shadow-lg shadow-blue-500/20"><i class="fa-solid fa-floppy-disk mr-2"></i> Simpan Permanen</button>
                    </div>

                    <h3 class="font-bold text-slate-300 mb-3 text-sm flex items-center gap-2 px-1"><i class="fa-solid fa-clock-rotate-left text-slate-500"></i> Riwayat Transaksi</h3>
                    <div class="space-y-3">
                        ${journalData.length === 0 ? '<div class="text-center p-8 bg-slate-800/40 rounded-xl border border-slate-800 border-dashed text-slate-500 text-sm">Jurnal kosong.</div>' : 
                        journalData.slice().reverse().map((entry, idx) => `
                            <div class="bg-slate-900 border ${entry.result === 'WIN' ? 'border-green-500/30' : 'border-red-500/30'} rounded-xl p-3.5 flex justify-between items-center relative overflow-hidden shadow-sm">
                                <div class="absolute left-0 top-0 w-1.5 h-full ${entry.result === 'WIN' ? 'bg-green-500' : 'bg-red-500'}"></div>
                                <div class="pl-3 w-3/4">
                                    <div class="flex items-center gap-2 mb-1"><span class="font-bold text-white text-[15px]">${entry.pair}</span><span class="text-[9px] font-bold px-2 py-0.5 rounded uppercase ${entry.action === 'BUY' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}">${entry.action}</span></div>
                                    <p class="text-[11px] text-slate-400 italic line-clamp-2">${entry.notes}</p>
                                    <p class="text-[9px] text-slate-500 mt-1.5 font-mono">${entry.date}</p>
                                </div>
                                <div class="text-right flex flex-col items-end justify-center">
                                    <span class="font-black text-xl ${entry.result === 'WIN' ? 'text-green-400 drop-shadow-sm' : 'text-red-400 drop-shadow-sm'}">${entry.result}</span>
                                    <button onclick="deleteJournal(${journalData.length - 1 - idx})" class="text-[10px] text-slate-500 hover:text-red-400 mt-2"><i class="fa-solid fa-trash-can mr-1"></i> Hapus</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            appContainer.innerHTML = html;
        }
        window.selectResult = function(res) {
            document.getElementById('j-result').value = res;
            const btnW = document.getElementById('btn-win'); const btnL = document.getElementById('btn-loss');
            btnW.className = "flex-1 bg-slate-800 border border-slate-700 text-slate-300 py-2.5 rounded-lg text-sm font-bold shadow-sm"; btnL.className = "flex-1 bg-slate-800 border border-slate-700 text-slate-300 py-2.5 rounded-lg text-sm font-bold shadow-sm";
            if(res === 'WIN') btnW.className = "flex-1 bg-green-900/40 border-2 border-green-500 text-green-400 py-2.5 rounded-lg text-sm font-bold shadow-[0_0_15px_rgba(34,197,94,0.15)] transform scale-[1.02]";
            if(res === 'LOSS') btnL.className = "flex-1 bg-red-900/40 border-2 border-red-500 text-red-400 py-2.5 rounded-lg text-sm font-bold shadow-[0_0_15px_rgba(239,68,68,0.15)] transform scale-[1.02]";
        }

        window.saveJournal = function() {
            const pair = document.getElementById('j-pair').value; const action = document.getElementById('j-action').value;
            const result = document.getElementById('j-result').value; const notes = document.getElementById('j-notes').value;
            if(!result) { showToast('Pilih hasil (WIN/LOSS)!', 'error'); return; }
            const date = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
            journalData.push({ pair, action, result, notes: notes || '-', date });
            localStorage.setItem('proTraderJournal', JSON.stringify(journalData)); showToast('Tersimpan!', 'success'); renderJournal();
        }

        window.deleteJournal = function(index) {
            if(confirm('Hapus permanen log ini?')) { journalData.splice(index, 1); localStorage.setItem('proTraderJournal', JSON.stringify(journalData)); renderJournal(); }
        }

        // ==========================================
        // 5. TAB 3: PROFIL & SETTINGS
        // ==========================================
        function renderProfile() {
            window.scrollTo(0, 0); document.getElementById('header-status').innerText = "Profil & Pengaturan";
            let level = "Amatir"; if(completedDays.length >= 10) level = "Novice"; if(completedDays.length >= 20) level = "Advanced"; if(completedDays.length === 30) level = "PRO TRADER ELITE";
            let winCount = journalData.filter(j => j.result === 'WIN').length;
            let winRate = journalData.length > 0 ? Math.round((winCount / journalData.length) * 100) : 0;

            let html = `
                <div class="fade-in pb-10">
                    <div class="bg-slate-900 rounded-2xl p-6 border border-slate-800 shadow-xl mb-6 text-center relative overflow-hidden">
                        <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
                        <div class="w-20 h-20 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl text-white shadow-[0_0_20px_rgba(59,130,246,0.3)] border-2 border-slate-800 relative z-10"><i class="fa-solid fa-user-tie"></i></div>
                        <h2 class="text-[22px] font-bold text-white mb-2 relative z-10 tracking-tight">Identitas Trader</h2>
                        <div class="inline-block bg-slate-800/80 border border-slate-700 px-4 py-1.5 rounded-full text-xs font-bold text-blue-400 mb-6 relative z-10 uppercase tracking-widest"><i class="fa-solid fa-ranking-star mr-1"></i> Rank: ${level}</div>
                        <div class="grid grid-cols-3 gap-2 border-t border-slate-800 pt-5 relative z-10">
                            <div><p class="text-[10px] text-slate-500 uppercase tracking-wide font-bold mb-1">Materi</p><p class="font-bold text-white text-lg">${completedDays.length}<span class="text-xs text-slate-500 font-normal">/30</span></p></div>
                            <div class="border-x border-slate-800"><p class="text-[10px] text-slate-500 uppercase tracking-wide font-bold mb-1">Trade Log</p><p class="font-bold text-white text-lg">${journalData.length}</p></div>
                            <div><p class="text-[10px] text-slate-500 uppercase tracking-wide font-bold mb-1">Win Rate</p><p class="font-bold ${winRate >= 50 ? 'text-green-400' : 'text-white'} text-lg">${winRate}%</p></div>
                        </div>
                    </div>
                    <h3 class="font-bold text-slate-300 mb-3 text-sm ml-1 px-1 uppercase tracking-wide">Protokol Keamanan</h3>
                    <div class="bg-indigo-900/20 border border-indigo-500/30 rounded-2xl p-5 mb-6 relative overflow-hidden">
                        <div class="absolute left-0 top-0 w-1 h-full bg-indigo-500"></div>
                        <div class="flex items-center gap-3 mb-3"><i class="fa-solid fa-shield-halved text-indigo-400 text-2xl drop-shadow"></i><div><h4 class="font-bold text-indigo-300 text-[15px]">Risiko Terkunci Paksa</h4><p class="text-[10px] text-indigo-400/80 mt-0.5 uppercase tracking-wide">Manajemen Modal Ketat</p></div></div>
                        <div class="bg-slate-900/80 rounded-xl p-3.5 mt-4 flex justify-between items-center border border-slate-800/50 shadow-inner">
                            <span class="text-slate-400 text-xs font-medium">Batas Maksimal Lot Size</span>
                            <span class="text-white font-mono font-bold text-xl bg-slate-800 px-4 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2"><i class="fa-solid fa-lock text-sm text-slate-500"></i> 0.01</span>
                        </div>
                    </div>
                    <h3 class="font-bold text-slate-300 mb-3 text-sm ml-1 px-1 uppercase tracking-wide">Sistem Database</h3>
                    <div class="bg-slate-900 rounded-xl border border-slate-800 overflow-hidden shadow-sm">
                        <button onclick="if(confirm('Yakin mereset kelulusan materi? (Log Jurnal tetap aman)')) { localStorage.removeItem('proTraderCompleted'); completedDays=[]; showToast('Di-reset ke Hari 1', 'info'); renderProfile(); }" class="w-full flex items-center justify-between p-4 border-b border-slate-800 hover:bg-slate-800/50 transition-colors group"><div class="flex items-center gap-3 text-sm text-slate-300 font-medium"><i class="fa-solid fa-rotate-left w-5 text-center text-slate-500 group-hover:text-blue-400 transition-colors"></i> Reset Modul Belajar</div><i class="fa-solid fa-chevron-right text-xs text-slate-600"></i></button>
                        <button onclick="if(confirm('KRITIS: Seluruh data log trade akan musnah! Lanjut?')) { localStorage.removeItem('proTraderJournal'); journalData=[]; showToast('Jurnal dibersihkan', 'info'); renderProfile(); }" class="w-full flex items-center justify-between p-4 hover:bg-slate-800/50 transition-colors group"><div class="flex items-center gap-3 text-sm text-red-400 font-medium"><i class="fa-solid fa-trash-can w-5 text-center text-red-400/70 group-hover:text-red-500 transition-colors"></i> Kosongkan Jurnal</div><i class="fa-solid fa-chevron-right text-xs text-slate-600"></i></button>
                    </div>
                    <p class="text-center text-[10px] text-slate-600 mt-8 font-mono">Pro Trader Hub VIP | Local Storage Auto-Save</p>
                </div>`;
            appContainer.innerHTML = html;
        }

        // Init
        switchTab('home');
    </script>
</body>
</html>
