    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1120; /* Dark slate background */
            color: #f8fafc; /* Light text */
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }
        
        /* Custom Scrollbar for better UX */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        
        /* Animations */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        .slide-up { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(100%); } to { opacity: 1; transform: translateY(0); } }

        .pulse-border { animation: pulseBorder 2s infinite; }
        @keyframes pulseBorder { 
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } 
        }

        /* Chart Background Pattern */
        .chart-bg {
            background-color: #0f172a;
            background-image: 
                linear-gradient(rgba(51, 65, 85, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(51, 65, 85, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Button interaction */
        .sim-btn { transition: all 0.2s; }
        .sim-btn:active { transform: scale(0.95); }
        
        /* Form outlines */
        input:focus, textarea:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }

        /* Animation for Live Candle Sim (Day 3) */
        @keyframes candleFluctuate {
            0% { height: 40px; top: 40px; background-color: #22c55e;}
            25% { height: 60px; top: 20px; background-color: #22c55e;}
            50% { height: 20px; top: 60px; background-color: #ef4444;}
            75% { height: 70px; top: 10px; background-color: #22c55e;}
            100% { height: 40px; top: 40px; background-color: #22c55e;}
        }
        .live-candle-body { 
            animation: candleFluctuate 3s infinite ease-in-out; 
            position: absolute; width: 24px; left: 50%; transform: translateX(-50%); border-radius: 2px;
        }
        .live-candle-wick { 
            position: absolute; width: 2px; height: 100px; top: 10px; background-color: #64748b; left: 50%; transform: translateX(-50%);
        }
    </style>
</head>

                theory: `
                    <div class="space-y-4 text-slate-300">
                        <p>Selamat datang di Hari 1! Sebelum kita menggambar garis apa pun di grafik, kita harus merombak total cara otakmu bekerja. Ini adalah rahasia terbesar mengapa 90% trader pemula hancur: <strong>Mereka berharap untuk menang di setiap transaksi.</strong></p>

                        <h4 class="font-bold text-white text-[15px] border-b border-slate-700 pb-1">1. Psikologi Sumbu (Wick / Ekor)</h4>

                        <h4 class="font-bold text-white text-[15px] border-b border-slate-700 pb-1">1. Mengapa Fakeout Terjadi? (Stop Hunt)</h4>

          // --- FUNGSI SIMULASI ---

                const risk = 5;
                
                sim1Bal += isWin ? reward : -risk;
                sim1Trades++;
                sim1History.push(sim1Bal);
                
                document.getElementById('sim1-bal').innerText = `$${sim1Bal}`;

                    : `<span class="text-red-400"><i class="fa-solid fa-arrow-trend-down mr-1"></i> Loss -$${risk} (Trade ${sim1Trades}/10)</span>`;
                
                drawSim1Chart();

                btn.disabled = false; btn.classList.remove('opacity-50', 'scale-95');
                if(sim1Trades === 10) { 
                    btn.innerText = "SIMULASI SELESAI";

                    document.getElementById('sim1-result').innerHTML = `Total 10 Trade selesai. Kamu ${isProfit ? 'Untung' : 'Rugi'} <span class="${isProfit ? 'text-green-400' : 'text-red-400'} font-bold">$${Math.abs(sim1Bal - 100)}</span>.`; 
                }
            }, 300);

        function drawSim1Chart() {
            const area = document.getElementById('sim1-chart-area');
            const maxBal = Math.max(...sim1History, 120);
            const minBal = Math.min(...sim1History, 80);
            const range = maxBal - minBal || 1;
            
            let svgPath = `M 0 ${40 - ((sim1History[0] - minBal) / range * 40)}`;
            const step = 100 / 10;
            
            for(let i=1; i<sim1History.length; i++) {
                svgPath += ` L ${i * step}% ${40 - ((sim1History[i] - minBal) / range * 40)}`;
            }

            area.innerHTML = `

                <svg viewBox="0 0 100 40" preserveAspectRatio="none" class="w-full h-full absolute top-0 left-0">
                    <path d="${svgPath}" fill="none" stroke="${sim1Bal >= 100 ? '#22c55e' : '#ef4444'}" stroke-width="2" vector-effect="non-scaling-stroke"/>

            if(!result) { showToast('Pilih hasil akhir (WIN/LOSS) dahulu!', 'error'); return; }
            
            const date = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
            
              // --- AUTO SAVE JURNAL KE LOCAL STORAGE ---
